<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Enlaces de la invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fdf6f5;--ink:#5a4030;--soft:#8a7160;--blue:#4f7db5;--rose:#d4808c;--line:rgba(90,64,48,.16)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-weight:300;line-height:1.55;padding:28px 18px 60px}
  main{max-width:560px;margin:0 auto}
  h1{font-family:"Pinyon Script",cursive;font-weight:400;font-size:clamp(2.4rem,9vw,3.4rem);color:var(--blue);text-align:center;margin:8px 0 4px}
  .sub{text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.15rem;color:var(--soft);margin:0 0 26px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:18px}
  label{display:block;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin:0 0 8px;font-weight:400}
  input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fffdfc;color:var(--ink)}
  input[type=text]:focus{outline:2px solid #b8d0ec;outline-offset:1px}
  .pases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
  .pases input{position:absolute;opacity:0}
  .pases span{display:block;text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:14px;font-family:"Cormorant Garamond",serif;font-size:1.2rem;cursor:pointer;background:#fffdfc}
  .pases input:checked + span{background:#e8f0fb;border-color:var(--blue);color:var(--blue);font-weight:600}
  .pases input:focus-visible + span{outline:2px solid #b8d0ec;outline-offset:2px}
  .pases label{margin:0;letter-spacing:0;text-transform:none;position:relative}
  .out{word-break:break-all;font-size:.95rem;background:#f8f3f1;border-radius:12px;padding:12px 14px;border:1px dashed var(--line);margin:0 0 14px;color:var(--ink)}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  button{font:inherit;cursor:pointer;border-radius:999px;padding:12px 22px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
  button.main{background:var(--blue);border-color:var(--blue);color:#fff}
  button:hover{opacity:.9}
  .note{font-family:"Cormorant Garamond",serif;font-size:1.05rem;color:var(--soft);margin:6px 0 0}
  .ok{color:var(--blue);min-height:1.4em;margin:10px 0 0;font-family:"Cormorant Garamond",serif;font-size:1.1rem}
  h2{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);font-weight:400;margin:0 0 12px}
  .rapidos p{margin:0 0 12px;word-break:break-all;font-size:.9rem}
  .rapidos b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.15rem;font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Enlaces de invitación</h1>
  <p class="sub">Escribe el nombre, elige cuántas personas entran y envíalo.</p>

  <div class="card">
    <label for="nombre">Nombre del invitado</label>
    <input type="text" id="nombre" placeholder="Ej.: Sra. Marycarmen Loor y esposo" autocomplete="off">
    <p class="note">Si lo dejas vacío, el sobre dice "Familia y amigos".</p>
  </div>

  <div class="card">
    <label>Admisión</label>
    <div class="pases" role="radiogroup" aria-label="Cantidad de personas">
      <label><input type="radio" name="pases" value="1" checked><span>1 persona</span></label>
      <label><input type="radio" name="pases" value="2"><span>2 personas</span></label>
      <label><input type="radio" name="pases" value="4"><span>4 personas</span></label>
    </div>
  </div>

  <div class="card">
    <label>Tu enlace</label>
    <p class="out" id="enlace"></p>
    <div class="row">
      <button type="button" class="main" id="copiar">Copiar enlace</button>
      <button type="button" id="wa">Enviar por WhatsApp</button>
    </div>
    <p class="ok" id="ok" aria-live="polite"></p>
  </div>

  <div class="card rapidos">
    <h2>Enlaces rápidos, sin nombre</h2>
    <p><b>1 persona</b><span id="r1"></span></p>
    <p><b>2 personas</b><span id="r2"></span></p>
    <p><b>4 personas</b><span id="r4"></span></p>
  </div>
</main>
<script>
(function(){
  var BASE = "https://valentina-baby.vercel.app/";
  var $ = function(s){ return document.querySelector(s); };
  function url(nombre, pases){
    var q = [];
    if (nombre) q.push("para=" + encodeURIComponent(nombre));
    if (pases > 1) q.push("pases=" + pases);
    return BASE + (q.length ? "?" + q.join("&") : "");
  }
  function pases(){ return parseInt(document.querySelector("input[name=pases]:checked").value, 10); }
  function pintar(){
    $("#enlace").textContent = url($("#nombre").value.trim(), pases());
    $("#r1").textContent = url("", 1); $("#r2").textContent = url("", 2); $("#r4").textContent = url("", 4);
  }
  function aviso(t){ $("#ok").textContent = t; setTimeout(function(){ $("#ok").textContent = ""; }, 2500); }
  $("#nombre").addEventListener("input", pintar);
  document.querySelectorAll("input[name=pases]").forEach(function(r){ r.addEventListener("change", pintar); });
  $("#copiar").addEventListener("click", function(){
    var t = $("#enlace").textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function(){ aviso("Enlace copiado."); }, function(){ aviso("No pude copiar. Mantén presionado el enlace para copiarlo."); });
    } else { aviso("Mantén presionado el enlace para copiarlo."); }
  });
  $("#wa").addEventListener("click", function(){
    var n = $("#nombre").value.trim();
    var msg = (n ? "Hola " + n + ". " : "Hola. ") + "Te invitamos a la Revelación de Sexo y Baby Shower del bebé de Valentina. Aquí está tu invitación:\n" + $("#enlace").textContent;
    window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg), "_blank", "noopener");
  });
  pintar();
})();
</script>
</body>
</html>
